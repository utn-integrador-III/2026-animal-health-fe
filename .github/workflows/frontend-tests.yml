name: Frontend Tests

on:
  workflow_dispatch:
  push:
    branches:
      - qa
      - dev
      - main
  pull_request:
    branches:
      - qa
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas del frontend
        run: npm test
